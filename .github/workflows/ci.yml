name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Python compile
        run: python -m compileall -q app tests scripts/restore-portable.py
      - name: Import application smoke test
        run: python -c "import app.main; print(app.main.APP_NAME, app.main.VERSION)"
      - name: Unit tests
        run: pytest -q
      - name: Bash syntax
        run: bash -n install.sh upgrade.sh scripts/*.sh
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Dangerous pattern guard
        run: |
          ! grep -R --line-number -E 'chmod[[:space:]]+777|shell=True|os\.system\(' app scripts install.sh systemd nginx
      - name: Makia naming contract
        run: |
          grep -q 'Makia VPS Manager' app/config.py
          grep -q '/opt/makia-vps-manager' scripts/install.sh
          grep -q 'makia-vps-manager.service' scripts/install.sh

      - name: Packaging contract
        run: |
          grep -q 'makia-protocol-traffic.service' scripts/install.sh
          grep -q 'makia-protocol-traffic.service' scripts/update.sh
          grep -q 'makia-doctor' scripts/install.sh
          grep -q 'makia-doctor' scripts/update.sh
          grep -q 'makia-protocol-traffic' scripts/uninstall.sh
          test -f systemd/makia-protocol-traffic.service
          test -f scripts/doctor.sh
          test -f upgrade.sh
          grep -q 'makia-upgrade' scripts/install.sh
          grep -q 'makia-upgrade' scripts/update.sh
          test -f app/static/manifest.webmanifest
          test -f app/static/sw.js
          test -f docs/UAT-0.8.0-RC2.md
          test -f docs/UAT-0.11.0-RC1.md
          test -f docs/UAT-0.12.0-RC1.md
          test -f docs/UAT-0.13.0-RC1.md
          test -f scripts/uat-smoke.sh
          test -f scripts/restore-portable.py
          grep -q 'makia-restore-portable' scripts/install.sh
          grep -q 'makia-restore-portable' scripts/update.sh
          grep -q 'makia-uat-smoke' scripts/install.sh
          grep -q 'makia-uat-smoke' scripts/update.sh
      - name: UAT v0.11 contract
        run: |
          grep -q 'Protected ZIP' docs/UAT-0.11.0-RC1.md
          grep -q 'Browser Smoke' docs/UAT-0.11.0-RC1.md
          grep -q 'data-action="protected-export"' app/static/app.js
      - name: UAT v0.12 contract
        run: |
          grep -q 'NPV Tunnel' docs/UAT-0.12.0-RC1.md
          grep -q 'Xray subscription QR' docs/UAT-0.12.0-RC1.md
          grep -q 'data-action="access-share"' app/static/app.js
          grep -q '/api/settings/operator' app/static/app.js
          grep -q 'npvt-ssh://' app/access_ops.py

      - name: UAT v0.13 contract
        run: |
          grep -q 'Portable Migration Bundle' docs/UAT-0.13.0-RC1.md
          grep -q 'WireGuard compatibility' docs/UAT-0.13.0-RC1.md
          grep -q 'makia-restore-portable' docs/UAT-0.13.0-RC1.md
          grep -q '/api/backups/portable' app/main.py
          grep -q 'wg-compat-preset' app/static/app.js
          grep -q 'Advanced JSON' app/static/app.js
          grep -q 'portable_migration_files' app/system_ops.py
          grep -q 'Preserving active Makia Nginx/Certbot configuration' scripts/update.sh
          grep -q '_xray_firewall_rules' app/protocol_ops.py
          grep -q '_ufw_allow_if_active' app/protocol_ops.py

  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      MAKIA_DATA_DIR: /tmp/makia-browser
      MAKIA_INITIAL_ADMIN_PASSWORD: BrowserTestPass!123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Protected export browser smoke
        run: python tests/browser_smoke.py

  xray-core-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      XRAY_BIN: /tmp/xray-runtime/xray
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download Xray 26.3.27
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          mkdir -p /tmp/xray-runtime
          unzip -q /tmp/xray.zip -d /tmp/xray-runtime
          chmod +x /tmp/xray-runtime/xray
          /tmp/xray-runtime/xray version
      - name: Validate generated VLESS XHTTP REALITY config
        run: python tests/xray_core_smoke.py
