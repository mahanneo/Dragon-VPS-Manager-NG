name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Python compile
        run: python -m compileall -q app tests
      - name: Unit tests
        run: pytest -q
      - name: Bash syntax
        run: bash -n install.sh scripts/*.sh
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Dangerous pattern guard
        run: |
          ! grep -R --line-number -E 'chmod[[:space:]]+777|shell=True|os\.system\(' app scripts install.sh systemd nginx
      - name: Makia naming contract
        run: |
          grep -q 'Makia VPS Manager' app/config.py
          grep -q '/opt/makia-vps-manager' scripts/install.sh
          grep -q 'makia-vps-manager.service' scripts/install.sh
