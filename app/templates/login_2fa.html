<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060913"><title>{{app_name}} - 2FA</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><div class="login-orb orb-a"></div><div class="login-orb orb-b"></div><main class="login-card"><div class="brand-mark login-mark">M</div><div class="eyebrow centered">TWO-FACTOR AUTHENTICATION</div><h1>MAKIA <span>2FA</span></h1><p>کد ۶ رقمی برنامه Authenticator را وارد کنید.</p>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" action="/login/2fa"><input type="hidden" name="token" value="{{token}}"><label>Authenticator code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required placeholder="123456"></label><button class="primary-btn" type="submit">تایید و ورود</button></form><div class="login-meta"><span>Time-based OTP</span><span>v{{version}}</span></div></main></body></html>
