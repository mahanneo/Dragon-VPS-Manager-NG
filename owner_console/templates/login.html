<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makia Owner Control Center</title><link rel="stylesheet" href="/static/owner.css"></head>
<body class="owner-login"><main class="owner-login-card"><div class="owner-mark">M</div><div class="eyebrow">PRIVATE PUBLISHER CONSOLE</div><h1>Makia Owner Control Center</h1><p>Private key فقط روی همین Control Center نگهداری می‌شود.</p>{% if error %}<div class="owner-alert danger">{{error}}</div>{% endif %}<form method="post" action="/login"><label>Owner Password<input type="password" name="password" autocomplete="current-password" required></label><label>Authenticator Code<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></label><button type="submit">ورود امن</button></form></main></body></html>
